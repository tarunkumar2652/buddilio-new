<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F172A" />
    <title>You're offline — Buddilio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; background: #0f172a; color: #fafafa;
        font-family: Manrope, sans-serif; display: flex; align-items: center;
        padding: 32px;
      }
      .wrap { max-width: 460px; }
      .mark {
        height: 48px; width: 48px; border-radius: 14px; display: grid; place-items: center;
        background: #fafafa; color: #0f172a; font-family: Outfit, sans-serif; font-weight: 700; font-size: 22px;
      }
      .over { margin-top: 40px; font-size: 11px; letter-spacing: .22em; text-transform: uppercase; color: #94a3b8; font-weight: 600; }
      h1 { font-family: Outfit, sans-serif; font-size: 34px; line-height: 1.1; margin: 12px 0 0; letter-spacing: -.02em; }
      p { color: #cbd5e1; line-height: 1.65; margin-top: 16px; font-size: 15px; }
      button {
        margin-top: 28px; border: 0; border-radius: 999px; background: #fafafa; color: #0f172a;
        padding: 14px 28px; font-weight: 700; font-size: 14px; font-family: Manrope, sans-serif;
        cursor: pointer; transition: transform .2s ease, background-color .2s ease;
      }
      button:hover { transform: scale(1.02); background: #ffffff; }
      .hint { margin-top: 32px; font-size: 12px; color: #64748b; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark">B</div>
      <p class="over">No connection</p>
      <h1>Your night out is still on.</h1>
      <p>
        Buddilio can't reach the internet right now. Anything you already opened stays available —
        reconnect to book experiences, message members and see live chats.
      </p>
      <button onclick="location.reload()" data-testid="offline-retry-btn">Try again</button>
      <p class="hint">Buddilio · curated social discovery for adults</p>
    </div>
  </body>
</html>
