crons:
  - name: monthly-prize
    description: "Awards a free pass to the top referral inviter of the previous month on the 1st"
    cron: "0 3 1 * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/monthly-prize"
    method: POST
    enabled: true
  - name: payout-reminders
    description: "Emails each manager every Monday with what their vendors are still owed (09:00 IST)"
    cron: "30 3 * * 1"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/payout-reminders"
    method: POST
    enabled: true
  - name: daily-maintenance
    description: "Daily: ID-check nudges plus vendor document expiry reminders and auto-pause (11:00 IST)"
    cron: "30 5 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/daily-maintenance"
    method: POST
    enabled: true
  - name: rating-nudges
    description: "Nudges guests a day after a hangout to leave their private rating (daily 10:00 IST)"
    cron: "30 4 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/rating-nudges"
    method: POST
    enabled: true
  - name: city-openings
    description: "Emails city waitlists once Buddilio goes live in their city"
    cron: "0 9 * * *"
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    endpoint: "{{BASE_URL}}/api/cron/city-openings"
    method: POST
    enabled: true
